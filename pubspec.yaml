name: recipora
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  random_string: ^2.3.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - images/

  fonts:
    - family: Fredoka
      fonts:
        - asset: fonts/Fredoka 2/Fredoka-VariableFont_wdth,wght.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/recipora_logo.png"